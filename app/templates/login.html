<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instructor Login - Multimodal Attendance Agent</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body style="display:flex; align-items:center; justify-content:center; background:#0f172a; min-height:100vh;">
  <div style="background:white; border-radius:12px; width:100%; max-width:420px; padding:32px; box-shadow:var(--shadow-lg);">
    <div style="text-align:center; margin-bottom:24px;">
      <div class="logo-badge" style="margin:0 auto 12px; width:48px; height:48px; font-size:22px;">MA</div>
      <h2 style="font-size:20px; font-weight:700; color:#0f172a;">Instructor Sign In</h2>
      <p style="font-size:12.5px; color:#64748b; margin-top:4px;">Offline Multimodal Attendance & Engagement Agent</p>
    </div>

    {% if error %}
    <div style="background:#fee2e2; border-left:4px solid #ef4444; color:#991b1b; padding:10px 14px; border-radius:4px; font-size:13px; margin-bottom:16px;">
      {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="{{ url_for('auth.login') }}">
      <div class="form-group">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-control" value="instructor" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" value="admin123" required>
      </div>

      <div style="font-size:11.5px; color:#64748b; margin-bottom:18px;">
        Default local credentials pre-filled: <code>instructor</code> / <code>admin123</code>
      </div>

      <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center; padding:10px;">
        Sign In to Local Dashboard
      </button>
    </form>
  </div>
</body>
</html>
